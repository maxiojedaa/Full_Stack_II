spring.application.name=api_gateway

# Configuración del puerto del API Gateway
server.port=8088


# --- RUTAS DE LOS MICROSERVICIOS ---
# 0. Microservicio Usuarios
spring.cloud.gateway.routes[0].id=ms-usuario
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 1. Microservicio Carrito
spring.cloud.gateway.routes[1].id=ms-carrito
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/carrito/**

# 2. Microservicio Catálogo
spring.cloud.gateway.routes[2].id=ms-catalogo
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/catalogo/**

# 3. Microservicio Pedidos
spring.cloud.gateway.routes[3].id=ms-pedidos
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pedidos/**

# 4. Microservicio Stock
spring.cloud.gateway.routes[4].id=ms-stock
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/productos/**

# 5. Microservicio Sistema de Pagos
spring.cloud.gateway.routes[5].id=ms-sistema-pago
spring.cloud.gateway.routes[5].uri=http://localhost:8085
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/pagos/**


# Desactivar Eureka para que funcione solo con rutas estáticas
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false