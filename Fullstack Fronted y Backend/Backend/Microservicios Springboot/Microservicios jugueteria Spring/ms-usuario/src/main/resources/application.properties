spring.application.name=ms-usuario
server.port=${SERVER_PORT:8081}

# Crear usuarios_db antes de iniciar (ver scripts/01_crear_base.sql).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/usuarios_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mismo enfoque de desarrollo que los microservicios de referencia.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Si se omite la clave, se genera una temporal: al reiniciar hay que iniciar sesión otra vez.
app.jwt.secret-base64=cGl4ZWx0b3lzLWp1Z3VldGVyaWEtMjAyNi1jbGF2ZS1qd3Qtc3VwZXItc2VndXJhLTI1NmJpdHM=
app.jwt.duracion-segundos=3600
app.cors.origenes=${CORS_ORIGINS:http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
