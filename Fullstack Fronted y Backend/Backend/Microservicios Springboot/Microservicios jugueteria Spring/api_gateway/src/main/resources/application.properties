spring.application.name=api_gateway
server.port=8088

# 0. Microservicio Usuarios (:8081)
spring.cloud.gateway.mvc.routes[0].id=ms-usuario
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

